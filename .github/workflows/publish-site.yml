name: Publish course website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Verify locally rendered teaching website
        run: |
          test -s _site/index.html
          test -s _site/lab-investigation.js
          for page in lab-01-fastq-asv lab-02-atlantic-microbiome lab-03-interactive-investigation lab-04-virtual-experiment; do
            test -s "_site/$page.html"
          done

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
